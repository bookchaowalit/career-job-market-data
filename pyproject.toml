[project]
name = "book-job-data"
version = "0.1.0"
description = "Lake-first job discovery data contract for Solo Empire Track B."
requires-python = ">=3.11"
dependencies = [
  "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
lake = [
  "duckdb>=1.1.0,<2.0.0",
  "pyarrow>=14.0.0,<24.0.0",
  "solo-empire-data-lake[lake] @ https://github.com/bookchaowalit/data-lake-core/archive/b8f8698995a4d4283247bd432d521b337ef8ec94.tar.gz",
]

[project.scripts]
book-job-data = "book_job_data.ingest:main"
book-job-data-api = "book_job_data.api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
# The code base is written to 120 columns; keep it rather than rewrap every file.
line-length = 120

[tool.ruff.lint]
# Pin the classic default rule set explicitly so newer ruff releases (0.16+
# widened the defaults) do not change what CI enforces.
select = ["E4", "E7", "E9", "F"]
