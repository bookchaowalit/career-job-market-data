# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12" # matches the Dockerfile (python:3.12-slim)
      # Installs from uv.lock (uv sync --frozen --all-extras): the lake extra (duckdb, pyarrow,
      # data-lake-core) is what the contract tests exercise; pytest comes from the dev group.
      # [tool.mypy] covers src/ only; tests are not typed yet.
      typecheck-command: uv pip install "mypy==2.4.0" && mypy
      # Same gates as the previous CI: offline contract/policy tests (no network, no paid
      # providers), compile, and the CLI entry points.
      test-command: >-
        FREE_ONLY=true ALLOW_EXTERNAL_NETWORK=false ALLOW_PAID_PROVIDER=false python -m pytest -q -rs
        && python -m compileall -q src
        && python -m book_job_data.ingest --help
        && book-job-data --help

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  image:
    # Builds the Dockerfile and scans the image with Trivy (packages inside the image, which the
    # Trivy fs scan cannot see). Blocking: a fixable HIGH/CRITICAL finding fails CI (and so Railway's Wait for CI).
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/image-scan.yml@b9957cccb3cc202e9e1a08df01924b8270d796df # v1.6.3
